<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Atomic Quest — 化学結合の探求</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0d1117;--navy:#161b27;--card:#1c2333;--card2:#222d3f;
  --gold:#f0a500;--gold2:#ffc843;--gold3:#fff0b3;
  --teal:#1ab87a;--teal2:#0d9e65;
  --blue:#3d8ef0;--blue2:#1a6fd4;
  --ember:#e8603a;--ember2:#c4441e;
  --purple:#8b7cf8;--purple2:#6c5ce7;
  --pink:#e84393;--fog:#8b96a8;--fog2:#5a6680;
  --cream:#f5edd6;--white:#ffffff;
  --xpg:#22c55e;--star:#fbbf24;
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.14);
}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

/* ─── SCREENS ─── */
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* ─── TOPBAR ─── */
.topbar{background:var(--navy);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;min-height:50px}
.topbar-l{display:flex;align-items:center;gap:10px}
.app-logo{width:28px;height:28px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.page-ttl{font-size:15px;font-weight:600}
.back-btn{width:34px;height:34px;background:var(--card);border:1px solid var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;flex-shrink:0;transition:background .15s}
.back-btn:active{background:var(--card2)}
.xp-pill{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#4ade80;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}

/* ─── SCROLL ─── */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 24px}

/* ─── MAP SCREEN ─── */
.hero{text-align:center;padding:20px 0 14px}
.hero-orb{width:72px;height:72px;border-radius:50%;background:var(--card);border:2px solid var(--gold);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:34px}
.hero h1{font-size:20px;font-weight:700;color:var(--gold);margin-bottom:5px}
.hero p{font-size:13px;color:var(--fog);line-height:1.5}

.lv-card{background:var(--navy);border:1px solid rgba(240,165,0,.2);border-radius:14px;padding:13px 15px;margin-bottom:14px}
.lv-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.lv-name{font-size:13px;color:var(--fog)}
.lv-title{font-size:14px;font-weight:600;color:var(--gold)}
.xp-track{height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-bottom:4px}
.xp-fill{height:100%;background:var(--teal);border-radius:4px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.xp-sub{font-size:11px;color:var(--fog);text-align:right}

.section-label{font-size:11px;font-weight:600;color:var(--fog);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px}

.planet-list{display:flex;flex-direction:column;gap:10px}
.p-card{background:var(--card);border-radius:14px;padding:13px;border:1.5px solid var(--border);cursor:pointer;display:flex;gap:12px;align-items:center;position:relative;transition:border-color .2s,transform .12s}
.p-card:active{transform:scale(.97)}
.p-card.done{border-color:rgba(240,165,0,.35)}
.p-card.locked{opacity:.38;cursor:not-allowed}
.p-orb{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.p-info{flex:1;min-width:0}
.p-name{font-size:14px;font-weight:600;margin-bottom:2px}
.p-sub{font-size:11px;color:var(--fog);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-stars{font-size:13px;letter-spacing:1px}
.p-badge{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px}
.badge-new{background:rgba(232,96,58,.18);color:#ff7a5c;border:1px solid rgba(232,96,58,.35)}
.badge-done{background:rgba(26,184,122,.15);color:#4ade80;border:1px solid rgba(26,184,122,.3)}
.badge-lock{background:rgba(255,255,255,.07);color:var(--fog)}

/* ─── PLANET SCREEN ─── */
.s-hdr{background:var(--navy);border-radius:14px;padding:14px;text-align:center;margin-bottom:13px}
.s-hdr h2{font-size:17px;font-weight:700;color:var(--gold);margin-bottom:3px}
.s-hdr p{font-size:12px;color:var(--fog)}

.stage-nav{display:flex;gap:6px;margin-bottom:13px}
.s-tab{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--fog);font-size:11px;font-weight:500;cursor:pointer;text-align:center;transition:all .2s}
.s-tab.active{background:var(--gold);color:#0d1117;border-color:var(--gold);font-weight:700}
.s-tab.done{border-color:var(--teal);color:#4ade80}

/* ─── SIM ─── */
.sim-wrap{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.sim-lbl{font-size:11px;font-weight:600;color:var(--fog);letter-spacing:.5px;margin-bottom:10px;text-align:center}
.sim-stage{width:100%;height:210px;border-radius:10px;background:rgba(0,0,0,.35);position:relative;overflow:hidden;touch-action:none;border:1px solid var(--border)}
.sim-msg{font-size:12px;color:#a7f3d0;line-height:1.5;margin-top:10px;padding:9px 11px;background:rgba(26,184,122,.12);border:1px solid rgba(26,184,122,.25);border-radius:10px;display:none}
.sim-msg.show{display:block}

/* atoms */
.atom{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:grab;user-select:none;border:2px solid rgba(255,255,255,.25);transition:box-shadow .25s}
.atom:active{cursor:grabbing;z-index:10}
.atom.glow{box-shadow:0 0 0 3px var(--teal),0 0 18px rgba(26,184,122,.45)}
.atom.glow-gold{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(240,165,0,.4)}
.atom-Na{background:#2563eb;color:#fff;width:48px;height:48px}
.atom-Cl{background:#dc2626;color:#fff;width:44px;height:44px}
.atom-H{background:#65a30d;color:#fff;width:36px;height:36px;font-size:11px}
.atom-O{background:#db2777;color:#fff;width:46px;height:46px}
.atom-C{background:#d97706;color:#fff;width:46px;height:46px}
.atom-Fe{background:#b45309;color:#fff;width:50px;height:50px}
.atom-Cu{background:#92400e;color:#fff;width:50px;height:50px}
.elec{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gold2);pointer-events:none}
.hint-txt{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--fog);white-space:nowrap;pointer-events:none}
.bond{position:absolute;height:3px;border-radius:2px;background:var(--teal);transform-origin:left center;pointer-events:none}
.bond2{background:var(--gold2)}
.bond3{background:var(--purple)}

/* ─── EXPLORE CARDS ─── */
.exp-card{background:var(--card);border-radius:12px;padding:13px;margin-bottom:9px;border-left:3px solid var(--purple);cursor:pointer;transition:background .15s}
.exp-card:active{background:var(--card2)}
.exp-head{display:flex;align-items:center;gap:10px;margin-bottom:0}
.exp-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.exp-title{font-size:13px;font-weight:600;color:var(--cream)}
.exp-hint{font-size:10px;color:var(--fog);margin-top:1px}
.exp-body{font-size:12px;color:#94a3b8;line-height:1.65;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:none}
.exp-body.open{display:block}
.formula-box{background:var(--navy);border-radius:10px;padding:12px;text-align:center;margin:10px 0;border:1px solid rgba(240,165,0,.2)}
.formula-big{font-size:20px;font-weight:700;color:var(--gold);margin-bottom:4px}
.formula-sub{font-size:11px;color:var(--fog)}

/* ─── QUIZ ─── */
.quiz-card{background:var(--card);border-radius:14px;padding:15px;margin-bottom:10px;border:1px solid var(--border)}
.quiz-q{font-size:14px;line-height:1.65;margin-bottom:13px;color:var(--cream);font-weight:500}
.quiz-opts{display:flex;flex-direction:column;gap:7px}
.opt{padding:11px 13px;border-radius:10px;border:1px solid var(--border2);background:rgba(255,255,255,.03);color:var(--white);font-size:13px;cursor:pointer;text-align:left;width:100%;transition:all .18s}
.opt:active:not(.disabled){transform:scale(.98)}
.opt.correct{background:rgba(26,184,122,.18);border-color:#4ade80;color:#4ade80}
.opt.wrong{background:rgba(232,96,58,.14);border-color:#ff7a5c;color:#ff7a5c}
.opt.disabled{pointer-events:none}
.quiz-exp{font-size:12px;color:#94a3b8;line-height:1.6;margin-top:9px;padding-top:9px;border-top:1px solid var(--border);display:none}
.quiz-exp.show{display:block}
.quiz-score{font-size:12px;color:var(--fog);text-align:right;margin-bottom:8px}

/* ─── RESULT ─── */
.result{text-align:center;padding:20px 10px 10px}
.result-icon{font-size:54px;margin-bottom:10px}
.result-title{font-size:20px;font-weight:700;color:var(--gold);margin-bottom:5px}
.result-sub{font-size:13px;color:var(--fog);margin-bottom:16px}
.xp-num{font-size:34px;font-weight:700;color:var(--xpg);margin-bottom:2px}
.xp-lbl{font-size:12px;color:var(--fog);margin-bottom:14px}
.stars-big{font-size:34px;letter-spacing:4px;margin-bottom:16px;color:var(--star)}

/* ─── CODEX SCREEN ─── */
.codex-card{background:var(--card);border-radius:12px;padding:13px;margin-bottom:9px;display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border)}
.codex-card.locked{opacity:.3}
.codex-avatar{width:44px;height:44px;border-radius:10px;background:rgba(139,124,248,.2);border:1px solid rgba(139,124,248,.35);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.codex-name{font-size:13px;font-weight:600;color:var(--gold);margin-bottom:1px}
.codex-year{font-size:10px;color:var(--fog);margin-bottom:5px}
.codex-desc{font-size:11px;color:#94a3b8;line-height:1.55}

/* ─── DASHBOARD ─── */
.dash-card{background:var(--card);border-radius:12px;padding:13px;margin-bottom:9px;border:1px solid var(--border)}
.dash-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dash-name{font-size:13px;font-weight:500}
.dash-xp{font-size:12px;color:var(--gold);font-weight:600}
.mini-bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.mini-fill{height:100%;background:var(--teal);border-radius:3px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
.stat-box{background:var(--card);border-radius:12px;padding:12px;text-align:center;border:1px solid var(--border)}
.stat-num{font-size:22px;font-weight:700;color:var(--gold)}
.stat-lbl{font-size:11px;color:var(--fog);margin-top:2px}

/* ─── BOTTOM NAV ─── */
.bottom-nav{background:var(--navy);border-top:1px solid var(--border);display:flex;flex-shrink:0}
.nav-btn{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:color .15s;color:var(--fog);font-size:10px;border:none;background:transparent}
.nav-btn.active{color:var(--gold)}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none}

/* ─── BUTTONS ─── */
.btn-p{width:100%;padding:13px;background:var(--gold);color:#0d1117;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s,opacity .15s;margin-top:4px}
.btn-p:active{transform:scale(.97);opacity:.85}
.btn-s{width:100%;padding:11px;background:rgba(255,255,255,.06);color:var(--white);border:1px solid var(--border2);border-radius:12px;font-size:13px;cursor:pointer;margin-top:7px;transition:background .15s}
.btn-s:active{background:rgba(255,255,255,.12)}
.btn-sm{padding:8px 14px;background:rgba(255,255,255,.06);color:var(--white);border:1px solid var(--border2);border-radius:9px;font-size:12px;cursor:pointer}
.btn-sm:active{background:rgba(255,255,255,.12)}

/* ─── TOAST ─── */
.toast{position:absolute;bottom:75px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(26,184,122,.92);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;pointer-events:none;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;max-width:280px;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─── FLASH ─── */
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rush{from{transform:translateX(0)}to{transform:translateX(180px)}}
@keyframes zap{0%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.9)}}
@keyframes ripple{0%{transform:scale(.3);opacity:.8}100%{transform:scale(2.5);opacity:0}}
.anim-pop{animation:pop .35s ease both}
.anim-float{animation:float 2.8s ease-in-out infinite}
</style>
</head>
<body>

<!-- ══════════════ MAP SCREEN ══════════════ -->

<!-- ══════════════ PLANET SCREEN ══════════════ -->

  <div class="topbar">

      <button class="back-btn" onclick="goMap()">←</button>

  <div class="topbar">
    <div class="topbar-l">
      <div class="app-logo">📖</div>
      <span class="page-ttl">発見者図鑑</span>
    </div>
    <span class="xp-pill" id="codex-xp">0 XP</span>

  <div class="bottom-nav">
    <button class="nav-btn" onclick="navTo('map')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/><path d="M2 12h20M12 2c-2.5 3-4 6.5-4 10s1.5 7 4 10"/></svg>
      マップ
    </button>
    <button class="nav-btn active" onclick="navTo('codex')">
      <svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h8M8 14h5"/></svg>
      図鑑
    </button>

      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>

<!-- ══════════════ DASHBOARD SCREEN ══════════════ -->
<div id="s-dash" class="screen">
  <div class="topbar">
    <div class="topbar-l">
      <div class="app-logo">📊</div>
      <span class="page-ttl">学習記録</span>
    </div>
    <span class="xp-pill" id="dash-xp">0 XP</span>
  </div>
  <div class="scroll" id="dash-content"></div>
  <div class="bottom-nav">
    <button class="nav-btn" onclick="navTo('map')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/><path d="M2 12h20M12 2c-2.5 3-4 6.5-4 10s1.5 7 4 10"/></svg>
      マップ
    </button>
    <button class="nav-btn" onclick="navTo('codex')">
      <svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h8M8 14h5"/></svg>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
const ST = {
  xp: 0, level: 0, streak: 0,
  planets: {}
};
const PLANET_IDS = ['ion','covalent','metal','molecular','crystal','polymer'];
PLANET_IDS.forEach(id => {
  ST.planets[id] = {stars:0, s1:false, s2:false, s3:false, score:0};
});

const LEVELS = [
  {xp:0,   title:'Lv.1 原子見習い'},
  {xp:150, title:'Lv.2 分子の探索者'},
  {xp:350, title:'Lv.3 結合の理解者'},
  {xp:600, title:'Lv.4 化学の賢者'},
  {xp:900, title:'Lv.5 量子の使い手'},
  {xp:1300,title:'Lv.MAX 結合の神'},
];

const PLANETS = [
  {id:'ion',    name:'イオン結合',   sub:'電子を渡す者・受け取る者',   orb:'🔵', col:'#2563eb', locked:false},
  {id:'covalent',name:'共有結合',    sub:'電子を分かち合う絆',          orb:'🌸', col:'#db2777', locked:false},
  {id:'metal',  name:'金属結合',     sub:'自由電子の海の謎',            orb:'⚡', col:'#d97706', locked:false},
  {id:'molecular',name:'分子の形',   sub:'形が性質を決める',            orb:'💠', col:'#7c3aed', locked:false},
  {id:'crystal', name:'結晶の世界',  sub:'4種類の結晶を制覇せよ',       orb:'💎', col:'#0891b2', locked:false},
  {id:'polymer', name:'高分子',      sub:'繰り返しが生む巨大分子',      orb:'🧬', col:'#16a34a', locked:false},
];

const SCIENTISTS = [

let toastT;
function toast(msg, ms=2000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), ms);
}

function addXP(n) {
  const prev = ST.level;
  ST.xp += n;
  updateLvUI();
  toast(`+${n} XP 獲得！`);
  if(ST.level > prev) setTimeout(() => toast(`🎉 レベルアップ！ ${LEVELS[ST.level].title}`, 3000), 400);
}

function updateLvUI() {
  let lv = 0;
  for(let i = LEVELS.length-1; i >= 0; i--) {
    if(ST.xp >= LEVELS[i].xp) { lv = i; break; }
  }
  ST.level = lv;
  const cur = LEVELS[lv], next = LEVELS[lv+1];
  document.getElementById('lv-title').textContent = cur.title;
  ['g-xp','p-xp','codex-xp','dash-xp'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.textContent = ST.xp + ' XP';
  });
  if(next) {
    const pct = Math.round(((ST.xp - cur.xp) / (next.xp - cur.xp)) * 100);
    document.getElementById('xp-fill').style.width = pct + '%';
    document.getElementById('xp-sub').textContent = ST.xp + ' / ' + next.xp + ' XP';
  } else {
    document.getElementById('xp-fill').style.width = '100%';
    document.getElementById('xp-sub').textContent = 'MAX LEVEL 達成！';
  }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
}

function navTo(tab) {

// DRAGGABLE
// ══════════════════════════════════════════
function makeDrag(el, container, onMove) {
  let drag = false, ox = 0, oy = 0;
  const gs = (e) => {
    drag = true;
    const t = e.touches ? e.touches[0] : e;
    const r = container.getBoundingClientRect();
    ox = t.clientX - r.left - parseFloat(el.style.left);
    oy = t.clientY - r.top  - parseFloat(el.style.top);
    e.preventDefault();
  };
  const gm = (e) => {
    if(!drag) return;
    const t = e.touches ? e.touches[0] : e;
    const r = container.getBoundingClientRect();
    const W = r.width, H = r.height;
    const ew = el.offsetWidth, eh = el.offsetHeight;
    const nx = Math.max(0, Math.min(W-ew, t.clientX-r.left-ox));
    const ny = Math.max(0, Math.min(H-eh, t.clientY-r.top-oy));
    el.style.left = nx + 'px';
    el.style.top  = ny + 'px';
    if(onMove) onMove(nx, ny);
    e.preventDefault();
  };
  const ge = () => { drag = false; };
  el.addEventListener('mousedown', gs);
  el.addEventListener('touchstart', gs, {passive:false});
  window.addEventListener('mousemove', gm);
  window.addEventListener('touchmove', gm, {passive:false});
  window.addEventListener('mouseup', ge);
  window.addEventListener('touchend', ge);
}

function buildIonSim() {
  document.getElementById('ion-stage').innerHTML = `
    <div class="sim-wrap">
      <div class="sim-lbl">NaをClに向かってドラッグしよう</div>
      <div class="sim-stage" id="c-ion"></div>
      <div class="sim-msg" id="ion-msg"></div>
    </div>
    <button class="btn-s" onclick="buildIonSim()">↺ リセット</button>
    <button class="btn-s" style="margin-top:6px" onclick="setStage('s2')">原理を知る →</button>
  `;
  const c = document.getElementById('c-ion');
  const W = c.offsetWidth||320, H = 210;
  let bonded = false;

  const na = mkAtom('Na','Na',W*.12,H/2-24);
  const cl = mkAtom('Cl','Cl',W*.7,H/2-22);
  c.appendChild(na); c.appendChild(cl);

  const hint = mkel('div','',`position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--fog);white-space:nowrap`,'→ ドラッグして近づけよう');
  c.appendChild(hint);

  makeDrag(na, c, () => {
    if(bonded) return;
    const nx=parseFloat(na.style.left)+24, ny=parseFloat(na.style.top)+24;
    const cx=parseFloat(cl.style.left)+22, cy=parseFloat(cl.style.top)+22;
    const d = Math.hypot(nx-cx, ny-cy);
    if(d < 65) { doIonBond(na, cl, c, hint); bonded = true; }
  });
}

function doIonBond(na, cl, c, hint) {
  hint.style.display = 'none';
  // electron animation
  const e = mkel('div','elec','left:'+  (parseFloat(na.style.left)+40)+'px;top:'+(parseFloat(na.style.top)+20)+'px','');
  c.appendChild(e);
  let ex = parseFloat(e.style.left), ey = parseFloat(e.style.top);
  const tx = parseFloat(cl.style.left)+10, ty = parseFloat(cl.style.top)+20;
  let t = 0;
  function moveE() {
    t += 0.06;
    ex += (tx-ex)*0.08; ey += (ty-ey)*0.08;
    e.style.left = ex+'px'; e.style.top = ey+'px';
    if(t < 1.5) animFrames.push(requestAnimationFrame(moveE));
    else {
      e.style.display='none';
      finishIonBond(na, cl, c);
    }
  }
  animFrames.push(requestAnimationFrame(moveE));
}

function finishIonBond(na, cl, c) {
  na.textContent = 'Na⁺'; na.classList.add('glow');
  cl.textContent = 'Cl⁻'; cl.classList.add('glow');
  const mid = document.createElement('div');
  mid.style.cssText='position:absolute;font-size:20px;font-weight:700;color:var(--teal)';
  const naL=parseFloat(na.style.left), naT=parseFloat(na.style.top);
  const clL=parseFloat(cl.style.left), clT=parseFloat(cl.style.top);
  mid.style.left = ((naL+clL+44)/2-8)+'px';
  mid.style.top  = ((naT+clT+44)/2-14)+'px';
  mid.textContent = '+';
  c.appendChild(mid);
  const ripple = document.createElement('div');
  ripple.style.cssText=`position:absolute;width:60px;height:60px;border-radius:50%;border:2px solid var(--teal);left:${parseFloat(na.style.left)-6}px;top:${parseFloat(na.style.top)-6}px;animation:ripple .8s ease-out both`;
  c.appendChild(ripple);
  const msg = document.getElementById('ion-msg');
  msg.textContent = '⚡ Na が電子1個を Cl に渡した！ Na⁺（陽イオン）と Cl⁻（陰イオン）が誕生。静電気力（クーロン力）で強く引き合う。これがイオン結合！';
  msg.classList.add('show');
  if(!ST.planets.ion.s1) {
    ST.planets.ion.s1 = true;
    addXP(25);
    setTimeout(()=>toast('ステージ1 完了！知る に進もう',2500),600);
  }
}

function buildCovSim() {
  document.getElementById('cov-stage').innerHTML = `

function doCovBond(h1,h2,e1,e2,c) {
  const cx=(parseFloat(h1.style.left)+parseFloat(h2.style.left))/2;
  const cy=(parseFloat(h1.style.top)+parseFloat(h2.style.top))/2;
  h1.style.left=(cx-2)+'px'; h1.style.top=cy+'px';
  h2.style.left=(cx+26)+'px'; h2.style.top=cy+'px';
  e1.style.left=(cx+12)+'px'; e1.style.top=(cy+8)+'px';
  e2.style.left=(cx+20)+'px'; e2.style.top=(cy+14)+'px';
  h1.classList.add('glow'); h2.classList.add('glow');
  e1.style.background=e2.style.background=var_('gold2');
  drawBond(c, cx+18, cy+18, cx+36, cy+18, '');
  const msg=document.getElementById('cov-msg');
  msg.textContent='🤝 2つのHが電子を1個ずつ出し合って共有電子対を形成！ 両Hともに He と同じ電子配置（2個）になり安定。これが共有結合 H–H（H₂分子）！';
  msg.classList.add('show');
  if(!ST.planets.covalent.s1){ST.planets.covalent.s1=true;addXP(25);}
}

function covMol(type) {
  const c=document.getElementById('c-cov'); if(!c)return;

  const msg=document.getElementById('cov-msg');
  if(type==='H2O'){
    const o=mkAtom('O','O',W/2-22,H/2-50);
    const h1=mkAtom('H','H',W*.2,H*0.7-18);
    const h2=mkAtom('H','H',W*.7,H*0.7-18);
    c.append(o,h1,h2);
    o.classList.add('glow'); h1.classList.add('glow'); h2.classList.add('glow');
    const ocx=parseFloat(o.style.left)+22,ocy=parseFloat(o.style.top)+22;
    const h1cx=parseFloat(h1.style.left)+18,h1cy=parseFloat(h1.style.top)+18;
    const h2cx=parseFloat(h2.style.left)+18,h2cy=parseFloat(h2.style.top)+18;
    drawBond(c,ocx,ocy,h1cx,h1cy,'');
    drawBond(c,ocx,ocy,h2cx,h2cy,'');
    const ang=mkel('div','','position:absolute;left:'+(W/2-25)+'px;top:'+(H/2+20)+'px;font-size:11px;color:var(--purple);font-weight:600','104.5°');
    c.appendChild(ang);
    msg.textContent='💧 H₂O：O が H×2 と共有結合。Oに非共有電子対が2組あり強く反発するため結合角が104.5°（折れ線形）になる。これが水の極性と特異な性質の原因。';
    msg.classList.add('show');
    if(!ST.planets.covalent.s1){ST.planets.covalent.s1=true;addXP(25);}
  } else if(type==='CO2'){
    const cv=mkAtom('C','C',W/2-22,H/2-22);
    const ol=mkAtom('O','O',W*.12,H/2-22);
    const or=mkAtom('O','O',W*.73,H/2-22);
    c.append(cv,ol,or);
    [cv,ol,or].forEach(a=>a.classList.add('glow'));
    const ccx=parseFloat(cv.style.left)+22,ccy=parseFloat(cv.style.top)+22;
    const lcx=parseFloat(ol.style.left)+22,lcy=parseFloat(ol.style.top)+22;
    const rcx=parseFloat(or.style.left)+22,rcy=parseFloat(or.style.top)+22;
    drawBond(c,ccx-4,ccy-3,lcx,lcy,'bond2');
    drawBond(c,ccx-4,ccy+3,lcx,lcy+6,'bond2');
    drawBond(c,ccx+4,ccy-3,rcx,rcy,'bond2');
    drawBond(c,ccx+4,ccy+3,rcx,rcy+6,'bond2');
    msg.textContent='CO₂：C と O が二重結合（=）×2。直線形で対称なため結合の極性が打ち消し合い、CO₂は無極性分子になる。（固体：ドライアイス、昇華性あり）';
    msg.classList.add('show');
  } else if(type==='N2'){
    const n1=mkAtom('H','N',W*.25,H/2-22); n1.style.background='#7c3aed';
    const n2=mkAtom('H','N',W*.62,H/2-22); n2.style.background='#7c3aed';
    c.append(n1,n2);
    [n1,n2].forEach(a=>a.classList.add('glow-gold'));

let metElecs=[], metForce=false, metAnimId=null;
function buildMetalSim() {
  if(metAnimId){cancelAnimationFrame(metAnimId);metAnimId=null;}
  metElecs=[]; metForce=false;
  document.getElementById('met-stage').innerHTML=`
    <div class="sim-wrap">
      <div class="sim-lbl">自由電子が金属全体を飛び回っている</div>
      <div class="sim-stage" id="c-met"></div>
      <div class="sim-msg" id="met-msg"></div>
    </div>
    <div style="display:flex;gap:7px;margin-top:8px">
      <button class="btn-sm" style="flex:1" onclick="metVoltage()">⚡ 電圧をかける</button>
      <button class="btn-sm" style="flex:1" onclick="metHeat()">🔥 熱を加える</button>
      <button class="btn-sm" onclick="buildMetalSim()">↺</button>
    </div>
    <button class="btn-s" style="margin-top:6px" onclick="setStage('s2')">原理を知る →</button>
  `;
  const c=document.getElementById('c-met'); if(!c)return;
  const W=c.offsetWidth||320,H=210;
  for(let r=0;r<3;r++) for(let col=0;col<5;col++){
    const ion=document.createElement('div');
    ion.style.cssText=`position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(217,119,6,.15);border:1.5px solid rgba(217,119,6,.45);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fbbf24;font-weight:600`;
    ion.textContent='Fe²⁺';
    ion.style.left=(W*0.06+col*56)+'px';
    ion.style.top=(16+r*58)+'px';
    c.appendChild(ion);
  }
  for(let i=0;i<10;i++){
    const e=document.createElement('div');
    e.style.cssText=`position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold2)`;
    e.style.left=(Math.random()*(W-20)+6)+'px';
    e.style.top=(Math.random()*170+10)+'px';
    c.appendChild(e);
    metElecs.push({el:e,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,x:parseFloat(e.style.left),y:parseFloat(e.style.top)});
  }
  if(!ST.planets.metal.s1){ST.planets.metal.s1=true;addXP(20);}
  function anim(){
    const W2=c.offsetWidth||320;
    metElecs.forEach(e=>{
      e.x+=e.vx+(metForce?2.5:0);
      e.y+=e.vy;
      if(e.x<2){e.x=2;e.vx=Math.abs(e.vx);}
      if(e.x>W2-10){e.x=metForce?4:W2-10;if(!metForce)e.vx=-Math.abs(e.vx);}
      if(e.y<2){e.y=2;e.vy=Math.abs(e.vy);}
      if(e.y>H-10){e.y=H-10;e.vy=-Math.abs(e.vy);}
      e.el.style.left=e.x+'px'; e.el.style.top=e.y+'px';
    });
    metAnimId=requestAnimationFrame(anim);
  }
  anim();
}

function metVoltage(){
  metForce=!metForce;
  const msg=document.getElementById('met-msg'); if(!msg)return;
  if(metForce){
    msg.textContent='⚡ 電圧をかけた！ 自由電子が一方向へ流れ始めた。これが電流の正体。金属が電気を通す理由はここにある。';
    msg.classList.add('show');
  } else {
    msg.classList.remove('show');
  }
}

function metHeat(){
  const msg=document.getElementById('met-msg'); if(!msg)return;
  metElecs.forEach(e=>{e.vx*=1.7;e.vy*=1.7;});
  msg.textContent='🔥 熱を加えた！ 自由電子の運動が激しくなった。自由電子が熱エネルギーを素早く伝達するため、金属は熱伝導性が高い。';

}

function showMolShape(formula,shape,clr){
  const c=document.getElementById('c-mol'); if(!c)return;
  c.innerHTML='';
  const W=c.offsetWidth||320,H=180;
  const msg=document.getElementById('mol-msg');

  const infos={
    'H₂O':{center:'O',ligands:[['H',W*.2,H*.65],['H',W*.7,H*.65]],lone:2,angle:'104.5°',
      desc:'Oに非共有電子対2組。反発で結合角が狭まり折れ線形に。極性分子。'},
    'NH₃':{center:'N',ligands:[['H',W*.2,H*.72],['H',W*.5,H*.8],['H',W*.78,H*.72]],lone:1,angle:'107°',
      desc:'Nに非共有電子対1組。三角錐形。極性分子。アンモニアの刺激臭の原因。'},
    'CH₄':{center:'C',ligands:[['H',W*.15,H*.35],['H',W*.75,H*.35],['H',W*.25,H*.78],['H',W*.65,H*.78]],lone:0,angle:'109.5°',
      desc:'非共有電子対なし。正四面体形。無極性分子。天然ガスの主成分。'},
    'CO₂':{center:'C',ligands:[['O',W*.1,H*.48],['O',W*.78,H*.48]],lone:0,angle:'180°',
      desc:'直線形・対称。C=O結合の極性が打ち消し合い無極性分子。ドライアイスの成分。'},
    'BF₃':{center:'B',ligands:[['F',W*.5,H*.12],['F',W*.15,H*.72],['F',W*.78,H*.72]],lone:0,angle:'120°',
      desc:'正三角形。Bは最外殻が6電子でオクテット則の例外。電子不足のため Lewis酸として働く。'},
    'SF₆':{center:'S',ligands:[['F',W*.5,H*.08],['F',W*.5,H*.82],['F',W*.12,H*.46],['F',W*.82,H*.46],['F',W*.22,H*.2],['F',W*.72,H*.2]],lone:0,angle:'90°',
      desc:'正八面体形。S は拡張オクテット（12電子）。すべて等価な F-S-F 結合角90°。'},
  };
  const info=infos[formula]||infos['H₂O'];
  const cx=W/2-22, cy=H*.35;
  const center=mkAtom(info.center,info.center,cx,cy-22);
  center.style.background=clr;
  c.appendChild(center);
  const cCx=parseFloat(center.style.left)+22, cCy=parseFloat(center.style.top)+22;
  info.ligands.forEach(([sym,lx,ly])=>{
    const lig=mkAtom('H',sym,lx-18,ly-18);
    lig.style.background='rgba(255,255,255,.15)';
    lig.style.borderColor='rgba(255,255,255,.3)';
    c.appendChild(lig);
    drawBond(c,cCx,cCy,parseFloat(lig.style.left)+18,parseFloat(lig.style.top)+18,'');
  });
  if(info.lone>0){
    for(let i=0;i<info.lone;i++){
      const lp=document.createElement('div');
      lp.style.cssText=`position:absolute;font-size:12px;color:${clr}`;
      lp.style.left=(cx+38+i*18)+'px';
      lp.style.top=(cy-28)+'px';
      lp.textContent='::';
      c.appendChild(lp);
    }
  }
  const angleLbl=mkel('div','',`position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;color:${clr};font-weight:600`,`${shape} / 結合角 ${info.angle}`);
  c.appendChild(angleLbl);
  msg.textContent=info.desc;
  msg.classList.add('show');
  if(!ST.planets.molecular.s1){ST.planets.molecular.s1=true;addXP(25);}
}

function genGrid(W,H,cols,rows,c1,c2,same=false){
  const res=[];
  for(let r=0;r<rows;r++) for(let cl=0;cl<cols;cl++){
    const div=document.createElement('div');
    const even=(r+cl)%2===0;
    const col=same?c1:even?c1:c2;
    div.style.cssText=`position:absolute;width:34px;height:34px;border-radius:50%;background:${col}33;border:1.5px solid ${col};display:flex;align-items:center;justify-content:center;font-size:10px;color:${col};font-weight:600`;
    div.textContent=same?'M':(even?'＋':'－');
    div.style.left=(W/(cols+1)*(cl+1)-17)+'px';
    div.style.top=(H/(rows+2)*(r+1)+15)+'px';
    res.push(div);
  }
  return res;
}

function genDiamond(W,H,clr){
  const res=[];
  const pts=[[W*.5,H*.2],[W*.25,H*.42],[W*.75,H*.42],[W*.38,H*.68],[W*.62,H*.68],[W*.5,H*.9]];
  const bonds=[[0,1],[0,2],[1,3],[2,4],[3,5],[4,5],[1,2],[3,4]];
  bonds.forEach(([a,b])=>{
    const ln=document.createElement('div');
    const dx=pts[b][0]-pts[a][0],dy=pts[b][1]-pts[a][1];
    const len=Math.hypot(dx,dy);
    const ang=Math.atan2(dy,dx)*180/Math.PI;
    ln.style.cssText=`position:absolute;height:2px;background:${clr};border-radius:1px;transform-origin:left center`;
    ln.style.left=pts[a][0]+'px';ln.style.top=pts[a][1]+'px';
    ln.style.width=len+'px';ln.style.transform=`rotate(${ang}deg)`;
    res.push(ln);
  });
  pts.forEach(([x,y])=>{
    const n=document.createElement('div');
    n.style.cssText=`position:absolute;width:20px;height:20px;border-radius:50%;background:${clr};display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:700`;
    n.style.left=(x-10)+'px';n.style.top=(y-10)+'px';n.textContent='C';
    res.push(n);
  });
  return res;
}

function genMetal(W,H,clr){
  const res=[];
  const ions=[];
  for(let r=0;r<3;r++) for(let cl=0;cl<5;cl++){
    const div=document.createElement('div');
    div.style.cssText=`position:absolute;width:38px;height:38px;border-radius:50%;background:${clr}22;border:1.5px solid ${clr}66;display:flex;align-items:center;justify-content:center;font-size:10px;color:${clr};font-weight:600`;
    div.textContent='M⁺';
    const x=W/(6)*(cl+1)-19, y=18+r*52;
    div.style.left=x+'px'; div.style.top=y+'px';
    res.push(div); ions.push({x:x+19,y:y+19});
  }
  for(let i=0;i<8;i++){
    const e=document.createElement('div');
    e.style.cssText=`position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold2)`;
    e.style.left=(Math.random()*(W-20)+8)+'px';
    e.style.top=(Math.random()*160+15)+'px';
    res.push(e);
  }
  return res;
}

const quizState={};
function buildQuizHTML(qs,id){
  return `
    <div class="quiz-score" id="qs-${id}">0 / ${qs.length} 正解</div>
    ${qs.map((q,i)=>`
    <div class="quiz-card" id="qc-${id}-${i}">
      <div class="quiz-q">Q${i+1}. ${q.q}</div>
      <div class="quiz-opts">
        ${q.opts.map((o,j)=>`<button class="opt" onclick="ansQ('${id}',${i},${j})">${o}</button>`).join('')}
      </div>
      <div class="quiz-exp" id="qe-${id}-${i}"></div>
    </div>`).join('')}
    <div id="qr-${id}" style="display:none"></div>
  `;
}

function initQuiz(id,qs){ quizState[id]={qs,answered:[],correct:0}; }

function ansQ(id,qi,ai){
  const st=quizState[id]; if(!st||st.answered.includes(qi))return;
  st.answered.push(qi);
  const q=st.qs[qi];
  const card=document.getElementById(`qc-${id}-${qi}`);
  const opts=card.querySelectorAll('.opt');
  opts.forEach((o,j)=>{
    o.classList.add('disabled');
    if(j===q.ans) o.classList.add('correct');
    else if(j===ai&&ai!==q.ans) o.classList.add('wrong');
  });
  const exp=document.getElementById(`qe-${id}-${qi}`);
  exp.textContent=q.exp; exp.classList.add('show');
  if(ai===q.ans){ st.correct++; toast('正解！ 素晴らしい！'); }
  else toast('惜しい！ 解説を読もう。');
  document.getElementById(`qs-${id}`).textContent=`${st.correct} / ${st.qs.length} 正解`;
  if(st.answered.length===st.qs.length){
    setTimeout(()=>showQuizResult(id,st.correct,st.qs.length),700);
  }
}

function showQuizResult(id,correct,total){
  const stars=correct===total?3:correct>=total*.6?2:1;
  const xpGain=correct===total?100:correct>=total*.6?60:30;
  const titles=['','よく頑張りました！','すごい！','完璧！'];
  document.getElementById(`qr-${id}`).style.display='block';
  document.getElementById(`qr-${id}`).innerHTML=`
    <div class="result">
      <div class="result-icon">${correct===total?'🏆':'🎯'}</div>
      <div class="result-title">${titles[stars]}</div>
      <div class="result-sub">${correct}問 / ${total}問 正解</div>
      <div class="stars-big">${'★'.repeat(stars)+'☆'.repeat(3-stars)}</div>
      <div class="xp-num">+${xpGain} XP</div>
      <div class="xp-lbl">獲得した経験値</div>
      <button class="btn-p" onclick="completePlanet('${id}',${stars},${xpGain})">惑星マップへ戻る 🌌</button>
      ${correct<total?`<button class="btn-s" onclick="retryQuiz('${id}')">もう一度挑戦 ↺</button>`:''}
    </div>`;
}

  const el=document.getElementById('codex-content');
  el.innerHTML=`
    <div style="padding:16px 0 8px;font-size:13px;font-weight:600;color:var(--fog);letter-spacing:.5px">発見者たちの記録</div>
    ${SCIENTISTS.map(s=>{
      const planet=PLANETS.find(p=>p.id===s.planet);
      const unlocked=ST.planets[s.planet]&&ST.planets[s.planet].stars>0;
      return `<div class="codex-card ${unlocked?'':'locked'}">
        <div class="codex-avatar">${unlocked?s.icon:'🔒'}</div>
        <div>
          <div class="codex-name">${unlocked?s.name:'???'}</div>
          <div class="codex-year">${unlocked?s.year:'──'} ｜ ${planet?planet.name:''}をクリアで解放</div>
          <div class="codex-desc">${unlocked?s.desc:'この科学者の記録を解放するには、対応する惑星をクリアしよう。'}</div>
        </div>
      </div>`;
    }).join('')}
    <div style="padding:12px 0;text-align:center;font-size:12px;color:var(--fog)">${SCIENTISTS.filter(s=>ST.planets[s.planet]&&ST.planets[s.planet].stars>0).length} / ${SCIENTISTS.length} 解放済み</div>
  `;
}

// ══════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════
function renderDash(){
  document.getElementById('dash-xp').textContent=ST.xp+' XP';
  const completed=PLANET_IDS.filter(id=>ST.planets[id].stars>0).length;
  const totalStars=PLANET_IDS.reduce((s,id)=>s+ST.planets[id].stars,0);
  const el=document.getElementById('dash-content');
  el.innerHTML=`
    <div style="padding:14px 0 10px;font-size:13px;font-weight:600;color:var(--fog);letter-spacing:.5px">学習サマリー</div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num">${ST.xp}</div><div class="stat-lbl">総 XP</div></div>
      <div class="stat-box"><div class="stat-num">${LEVELS[ST.level].title.split(' ')[0]}</div><div class="stat-lbl">レベル</div></div>
      <div class="stat-box"><div class="stat-num">${completed}</div><div class="stat-lbl">クリア惑星</div></div>
      <div class="stat-box"><div class="stat-num">${totalStars}</div><div class="stat-lbl">獲得★</div></div>
    </div>
    <div style="font-size:12px;font-weight:600;color:var(--fog);margin:4px 0 9px;letter-spacing:.5px">惑星別進捗</div>
    ${PLANETS.map(p=>{
      const st=ST.planets[p.id];
      const pct=Math.round(((st.s1?1:0)+(st.s2?1:0)+(st.s3?1:0))/3*100);
      const stars='★'.repeat(st.stars)+'☆'.repeat(3-st.stars);
      return `<div class="dash-card">
        <div class="dash-row">
          <span class="dash-name">${p.orb} ${p.name}</span>
          <span class="dash-xp" style="color:var(--star)">${stars}</span>
        </div>
        <div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>
        <div style="font-size:10px;color:var(--fog);text-align:right;margin-top:3px">${pct}% 完了</div>
      </div>`;
    }).join('')}
    <div style="margin-top:14px;font-size:12px;color:var(--fog);text-align:center">
      全ての惑星をクリアして「結合の神」を目指せ！
    </div>
  `;
}

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function mkAtom(cls,label,x,y){
  const el=document.createElement('div');
  el.className=`atom atom-${cls}`;
  el.style.left=x+'px'; el.style.top=y+'px';
  el.textContent=label;
  return el;
}
function mkElec(x,y){
  const el=document.createElement('div');
  el.className='elec';
  el.style.left=x+'px'; el.style.top=y+'px';
  return el;
}
function mkel(tag,cls,style,text){
  const el=document.createElement(tag);
  if(cls) el.className=cls;
  if(style) el.style.cssText=style;
  if(text) el.textContent=text;
  return el;
}
function atomDist(a,b,aw,bw){
  const ax=parseFloat(a.style.left)+aw, ay=parseFloat(a.style.top)+aw;
  const bx=parseFloat(b.style.left)+bw, by=parseFloat(b.style.top)+bw;
  return Math.hypot(ax-bx,ay-by);
}
function drawBond(container,x1,y1,x2,y2,cls){
  const dx=x2-x1, dy=y2-y1;
  const len=Math.hypot(dx,dy);
  const ang=Math.atan2(dy,dx)*180/Math.PI;
  const bond=document.createElement('div');
  bond.className='bond'+(cls?' '+cls:'');
  bond.style.left=x1+'px'; bond.style.top=y1+'px';
  bond.style.width=len+'px';
  bond.style.transform=`rotate(${ang}deg)`;
  container.appendChild(bond);
  return bond;
}
function expCard(icon,title,hint,body,borderColor){
  return `<div class="exp-card" style="border-left-color:${borderColor||'var(--purple)'}">
    <div class="exp-head">
      <div class="exp-icon" style="background:${(borderColor||'#8b7cf8')}22">${icon}</div>
      <div><div class="exp-title">${title}</div><div class="exp-hint">${hint}</div></div>
    </div>
    <div class="exp-body">${body}</div>
  </div>`;
}
function var_(name){ return getComputedStyle(document.documentElement).getPropertyValue('--'+name).trim()||'#ffc843'; }

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
updateLvUI();
renderMap();
</script>
